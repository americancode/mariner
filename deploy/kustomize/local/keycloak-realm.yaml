apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  periscope-realm.json: |
    {
      "realm": "periscope",
      "enabled": true,
      "registrationAllowed": false,
      "clients": [{
        "clientId": "periscope",
        "enabled": true,
        "publicClient": false,
        "secret": "periscopeClientSecret123!",
        "redirectUris": ["https://periscope.127.0.0.1.sslip.io/auth/callback"],
        "webOrigins": ["https://periscope.127.0.0.1.sslip.io"],
        "standardFlowEnabled": true,
        "protocol": "openid-connect"
      }],
      "users": [{
        "username": "demo",
        "enabled": true,
        "email": "demo@example.com",
        "firstName": "Demo",
        "lastName": "User",
        "credentials": [{"type": "password", "value": "DemoPassword123!", "temporary": false}]
      }]
    }
