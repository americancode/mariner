apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  mariner-realm.json: |
    {
      "realm": "mariner",
      "enabled": true,
      "registrationAllowed": false,
      "clients": [{
        "clientId": "mariner",
        "enabled": true,
        "publicClient": false,
        "secret": "MarinerClientSecret123!",
        "redirectUris": ["https://mariner.127.0.0.1.sslip.io/auth/callback"],
        "webOrigins": ["https://mariner.127.0.0.1.sslip.io"],
        "standardFlowEnabled": true,
        "protocol": "openid-connect",
        "protocolMappers": [{
          "name": "groups",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-group-membership-mapper",
          "config": {
            "full.path": "false",
            "id.token.claim": "true",
            "access.token.claim": "true",
            "userinfo.token.claim": "true",
            "claim.name": "groups"
          }
        }]
      }],
      "groups": [{"name": "admins"}],
      "users": [{
        "username": "demo",
        "enabled": true,
        "email": "demo@example.com",
        "firstName": "Demo",
        "lastName": "User",
        "credentials": [{"type": "password", "value": "DemoPassword123!", "temporary": false}]
      }, {
        "username": "mariner-admin",
        "enabled": true,
        "email": "mariner-admin@example.com",
        "firstName": "Mariner",
        "lastName": "Administrator",
        "groups": ["/admins"],
        "credentials": [{"type": "password", "value": "MarinerAppAdmin123!", "temporary": false}]
      }]
    }
