apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: periscope-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: periscope-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: periscope-db
  template:
    metadata:
      labels:
        app: periscope-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: periscope
            - name: POSTGRES_USER
              value: periscope
            - name: POSTGRES_PASSWORD
              value: periscopePostgres123!
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: periscope-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: periscope-db
spec:
  selector:
    app: periscope-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
