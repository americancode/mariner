apiVersion: apps/v1
kind: Deployment
{{- $imageTag := default .Chart.AppVersion .Values.image.tag }}
metadata:
  name: {{ include "mariner.fullname" . }}
  labels:
    {{- include "mariner.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mariner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mariner.selectorLabels" . | nindent 8 }}
      annotations:
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
        {{- $configValues := dict "database" .Values.database "audit" .Values.audit "oidc" .Values.oidc "organizations" .Values.organizations }}
        checksum/config-values: {{ toJson $configValues | sha256sum }}
    spec:
      serviceAccountName: {{ include "mariner.serviceAccountName" . }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mariner
          image: "{{ .Values.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "mariner.fullname" . }}
          env:
            - name: ADDR
              value: ":8080"
            - name: DATA_DIR
              value: /data
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mariner.secretName" . }}
                  key: {{ if .Values.oidc.existingSecret.name }}{{ required "oidc.existingSecret.cookieSecretKey is required" .Values.oidc.existingSecret.cookieSecretKey }}{{ else }}COOKIE_SECRET{{ end }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mariner.secretName" . }}
                  key: {{ if .Values.oidc.existingSecret.name }}{{ required "oidc.existingSecret.clientSecretKey is required" .Values.oidc.existingSecret.clientSecretKey }}{{ else }}OIDC_CLIENT_SECRET{{ end }}
            - name: OIDC_CLIENT_ID
              {{- if .Values.oidc.existingSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "mariner.secretName" . }}
                  key: {{ required "oidc.existingSecret.clientIdKey is required" .Values.oidc.existingSecret.clientIdKey }}
              {{- else }}
              value: {{ required "oidc.clientId is required when existingSecret.name is empty" .Values.oidc.clientId | quote }}
              {{- end }}
            {{- if and .Values.database.existingSecret.name .Values.database.existingSecret.urlKey }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ required "database.existingSecret.urlKey is required" .Values.database.existingSecret.urlKey }}
            {{- else if .Values.database.existingSecret.name }}
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ required "database.existingSecret.hostKey is required" .Values.database.existingSecret.hostKey }}
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ default "port" .Values.database.existingSecret.portKey }}
                  optional: true
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ required "database.existingSecret.databaseKey is required" .Values.database.existingSecret.databaseKey }}
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ required "database.existingSecret.usernameKey is required" .Values.database.existingSecret.usernameKey }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ required "database.existingSecret.passwordKey is required" .Values.database.existingSecret.passwordKey }}
            - name: DATABASE_SSLMODE
              value: {{ default "disable" .Values.database.sslMode | quote }}
            {{- else if .Values.database.url }}
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
            {{- if .Values.organizationEncryption.enabled }}
            - name: MARINER_ORG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mariner.organizationEncryptionSecretName" . }}
                  key: {{ include "mariner.organizationEncryptionSecretKey" . }}
            {{- end }}
            {{- range $organizationName, $configuredOrg := .Values.organizations }}
            {{- $orgKey := upper (replace "-" "_" (default $organizationName $configuredOrg.id)) }}
            {{- range $connectionName, $configured := $configuredOrg.connections }}
            {{- $connKey := upper (replace "-" "_" (default $connectionName $configured.id)) }}
            {{- with $configured.credentials }}
            - name: MARINER_ORG_{{ $orgKey }}_CONN_{{ $connKey }}_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "organization connection credentials.secretName is required" .secretName }}
                  key: {{ default "accessKey" .accessKeyKey }}
            - name: MARINER_ORG_{{ $orgKey }}_CONN_{{ $connKey }}_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "organization connection credentials.secretName is required" .secretName }}
                  key: {{ default "secretKey" .secretKeyKey }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if or .Values.caBundle.secretName .Values.caBundle.configMapName }}
            - name: SSL_CERT_DIR
              {{- if and .Values.caBundle.secretName .Values.caBundle.configMapName }}
              value: "/etc/mariner-ca/secret:/etc/mariner-ca/configmap"
              {{- else if .Values.caBundle.secretName }}
              value: "/etc/mariner-ca/secret"
              {{- else }}
              value: "/etc/mariner-ca/configmap"
              {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/me
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/me
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.caBundle.secretName }}
            - name: ca-input-secret
              mountPath: /etc/mariner-ca/secret
              readOnly: true
            {{- end }}
            {{- if .Values.caBundle.configMapName }}
            - name: ca-input-configmap
              mountPath: /etc/mariner-ca/configmap
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if and .Values.audit.enabled .Values.audit.sidecar.enabled }}
        - name: audit-forwarder
          image: {{ default (printf "%s:%s" .Values.image.repository $imageTag) .Values.audit.sidecar.image | quote }}
          imagePullPolicy: IfNotPresent
          {{- if .Values.audit.sidecar.command }}
          command:
            {{- toYaml .Values.audit.sidecar.command | nindent 12 }}
          {{- else }}
          command: ["/mariner", "audit-forwarder"]
          {{- end }}
          {{- if .Values.audit.sidecar.args }}
          args:
            {{- toYaml .Values.audit.sidecar.args | nindent 12 }}
          {{- else }}
          args: []
          {{- end }}
          env:
            - name: DATABASE_DRIVER
              value: {{ default "postgres" .Values.database.driver | quote }}
            - name: DATA_DIR
              value: /data
            - name: AUDIT_FORWARDER_POLLING_INTERVAL
              value: {{ default "2s" .Values.audit.sidecar.pollingInterval | quote }}
            - name: AUDIT_FORWARDER_BATCH_SIZE
              value: {{ default 100 .Values.audit.sidecar.batchSize | quote }}
            {{- if and .Values.database.existingSecret.name .Values.database.existingSecret.urlKey }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.urlKey }}
            {{- else if .Values.database.existingSecret.name }}
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.hostKey }}
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ default "port" .Values.database.existingSecret.portKey }}
                  optional: true
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.databaseKey }}
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.usernameKey }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.passwordKey }}
            {{- end }}
            {{- with .Values.audit.sidecar.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.audit.sidecar.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with .Values.audit.sidecar.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mariner.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.caBundle.secretName }}
        - name: ca-input-secret
          secret:
            secretName: {{ .Values.caBundle.secretName }}
        {{- end }}
        {{- if .Values.caBundle.configMapName }}
        - name: ca-input-configmap
          configMap:
            name: {{ .Values.caBundle.configMapName }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
