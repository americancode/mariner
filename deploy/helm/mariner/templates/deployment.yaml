apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "periscope.fullname" . }}
  labels:
    {{- include "periscope.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "periscope.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "periscope.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "periscope.serviceAccountName" . }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.caBundle.secretName .Values.caBundle.configMapName }}
      initContainers:
        - name: ca-bundle
          image: {{ .Values.caBundle.initImage | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - >-
              cp /etc/ssl/certs/ca-certificates.crt /work/ca-certificates.crt
              && printf '\n' >> /work/ca-certificates.crt
              && if [ -d /etc/periscope-ca/secret ]; then for file in /etc/periscope-ca/secret/*; do cat "$file" >> /work/ca-certificates.crt; printf '\n' >> /work/ca-certificates.crt; done; fi
              && if [ -d /etc/periscope-ca/configmap ]; then for file in /etc/periscope-ca/configmap/*; do cat "$file" >> /work/ca-certificates.crt; printf '\n' >> /work/ca-certificates.crt; done; fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: ca-bundle
              mountPath: /work
            {{- if .Values.caBundle.secretName }}
            - name: ca-input-secret
              mountPath: /etc/periscope-ca/secret
              readOnly: true
            {{- end }}
            {{- if .Values.caBundle.configMapName }}
            - name: ca-input-configmap
              mountPath: /etc/periscope-ca/configmap
              readOnly: true
            {{- end }}
      {{- end }}
      containers:
        - name: periscope
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "periscope.fullname" . }}
          env:
            - name: ADDR
              value: ":8080"
            - name: DATA_DIR
              value: /data
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "periscope.secretName" . }}
                  key: COOKIE_SECRET
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "periscope.secretName" . }}
                  key: {{ if .Values.existingSecret.name }}{{ required "existingSecret.clientSecretKey is required" .Values.existingSecret.clientSecretKey }}{{ else }}OIDC_CLIENT_SECRET{{ end }}
            - name: OIDC_CLIENT_ID
              {{- if .Values.existingSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "periscope.secretName" . }}
                  key: {{ required "existingSecret.clientIdKey is required" .Values.existingSecret.clientIdKey }}
              {{- else }}
              value: {{ required "oidc.clientId is required when existingSecret.name is empty" .Values.oidc.clientId | quote }}
              {{- end }}
            {{- if and .Values.database.existingSecret.name .Values.database.existingSecret.urlKey }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ required "database.existingSecret.urlKey is required" .Values.database.existingSecret.urlKey }}
            {{- else if .Values.database.existingSecret.name }}
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ required "database.existingSecret.hostKey is required" .Values.database.existingSecret.hostKey }}
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ default "port" .Values.database.existingSecret.portKey }}
                  optional: true
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ required "database.existingSecret.databaseKey is required" .Values.database.existingSecret.databaseKey }}
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ required "database.existingSecret.usernameKey is required" .Values.database.existingSecret.usernameKey }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ required "database.existingSecret.passwordKey is required" .Values.database.existingSecret.passwordKey }}
            - name: DATABASE_SSLMODE
              value: {{ default "disable" .Values.database.sslMode | quote }}
            {{- else if .Values.database.url }}
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
            {{- if .Values.organizationEncryption.enabled }}
            - name: periscope_ORG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "periscope.organizationEncryptionSecretName" . }}
                  key: {{ include "periscope.organizationEncryptionSecretKey" . }}
            {{- end }}
            {{- range $organizationName, $configuredOrg := .Values.organizations }}
            {{- $orgKey := upper (replace "-" "_" (default $organizationName $configuredOrg.id)) }}
            {{- range $connectionName, $configured := $configuredOrg.connections }}
            {{- $connKey := upper (replace "-" "_" (default $connectionName $configured.id)) }}
            {{- with $configured.credentials }}
            - name: periscope_ORG_{{ $orgKey }}_CONN_{{ $connKey }}_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "organization connection credentials.secretName is required" .secretName }}
                  key: {{ default "accessKey" .accessKeyKey }}
            - name: periscope_ORG_{{ $orgKey }}_CONN_{{ $connKey }}_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "organization connection credentials.secretName is required" .secretName }}
                  key: {{ default "secretKey" .secretKeyKey }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if or .Values.caBundle.secretName .Values.caBundle.configMapName }}
            - name: SSL_CERT_FILE
              value: /etc/periscope-ca-bundle/ca-certificates.crt
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/me
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/me
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if or .Values.caBundle.secretName .Values.caBundle.configMapName }}
            - name: ca-bundle
              mountPath: /etc/periscope-ca-bundle
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if and .Values.audit.enabled .Values.audit.sidecar.enabled }}
        - name: audit-forwarder
          image: {{ default (printf "%s:%s" .Values.image.repository .Values.image.tag) .Values.audit.sidecar.image | quote }}
          imagePullPolicy: IfNotPresent
          {{- if .Values.audit.sidecar.command }}
          command:
            {{- toYaml .Values.audit.sidecar.command | nindent 12 }}
          {{- else }}
          command: ["/periscope", "audit-forwarder"]
          {{- end }}
          {{- if .Values.audit.sidecar.args }}
          args:
            {{- toYaml .Values.audit.sidecar.args | nindent 12 }}
          {{- else }}
          args: []
          {{- end }}
          env:
            - name: DATABASE_DRIVER
              value: {{ default "postgres" .Values.database.driver | quote }}
            - name: DATA_DIR
              value: /data
            {{- if and .Values.database.existingSecret.name .Values.database.existingSecret.urlKey }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.urlKey }}
            {{- else if .Values.database.existingSecret.name }}
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.hostKey }}
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ default "port" .Values.database.existingSecret.portKey }}
                  optional: true
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.databaseKey }}
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.usernameKey }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.passwordKey }}
            {{- end }}
            {{- with .Values.audit.sidecar.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.audit.sidecar.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "periscope.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if or .Values.caBundle.secretName .Values.caBundle.configMapName }}
        {{- if .Values.caBundle.secretName }}
        - name: ca-input-secret
          secret:
            secretName: {{ .Values.caBundle.secretName }}
        {{- end }}
        {{- if .Values.caBundle.configMapName }}
        - name: ca-input-configmap
          configMap:
            name: {{ .Values.caBundle.configMapName }}
        {{- end }}
        - name: ca-bundle
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
