{{- if and .Values.audit.enabled .Values.audit.forwarder.enabled (ne .Values.database.driver "sqlite") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mariner.fullname" . }}-audit-forwarder
  labels:
    {{- include "mariner.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mariner.name" . }}-audit-forwarder
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mariner.name" . }}-audit-forwarder
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config-values: {{ toJson (dict "database" .Values.database "audit" .Values.audit) | sha256sum }}
    spec:
      serviceAccountName: {{ include "mariner.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: audit-forwarder
          image: {{ default (printf "%s:%s" .Values.image.repository (default .Chart.AppVersion .Values.image.tag)) .Values.audit.forwarder.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.audit.forwarder.command }}
          command:
            {{- toYaml .Values.audit.forwarder.command | nindent 12 }}
          {{- else }}
          command: ["/mariner", "audit-forwarder"]
          {{- end }}
          {{- if .Values.audit.forwarder.args }}
          args:
            {{- toYaml .Values.audit.forwarder.args | nindent 12 }}
          {{- end }}
          env:
            - name: DATABASE_DRIVER
              value: {{ default "postgres" .Values.database.driver | quote }}
            - name: DATA_DIR
              value: /data
            - name: AUDIT_FORWARDER_POLLING_INTERVAL
              value: {{ default "2s" .Values.audit.forwarder.pollingInterval | quote }}
            - name: AUDIT_FORWARDER_BATCH_SIZE
              value: {{ default 100 .Values.audit.forwarder.batchSize | quote }}
            {{- if and .Values.database.existingSecret.name .Values.database.existingSecret.urlKey }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.urlKey }}
            {{- else if .Values.database.existingSecret.name }}
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.hostKey }}
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ default "port" .Values.database.existingSecret.portKey }}
                  optional: true
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.databaseKey }}
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.usernameKey }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.passwordKey }}
            - name: DATABASE_SSLMODE
              value: {{ default "disable" .Values.database.sslMode | quote }}
            {{- end }}
            {{- with .Values.audit.forwarder.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.audit.forwarder.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with .Values.audit.forwarder.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mariner.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
