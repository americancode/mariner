{{- if not .Values.oidc.existingSecret.name }}
{{- $current := lookup "v1" "Secret" .Release.Namespace (include "mariner.secretName" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mariner.secretName" . }}
  labels:
    {{- include "mariner.labels" . | nindent 4 }}
type: Opaque
data:
  COOKIE_SECRET: {{ if $current }}{{ required (printf "managed application Secret %s is missing COOKIE_SECRET" (include "mariner.secretName" .)) (index $current.data "COOKIE_SECRET") | quote }}{{ else if .Release.IsInstall }}{{ default (randAlphaNum 64) .Values.cookieSecret | b64enc | quote }}{{ else }}{{ fail (printf "managed application Secret %s is missing during upgrade; refusing to generate a replacement COOKIE_SECRET" (include "mariner.secretName" .)) }}{{ end }}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | b64enc | quote }}
{{- end }}
