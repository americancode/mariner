{{- if and .Values.organizationEncryption.enabled (not .Values.organizationEncryption.existingSecret.name) }}
{{- $name := include "periscope.organizationEncryptionSecretName" . -}}
{{- $key := include "periscope.organizationEncryptionSecretKey" . -}}
{{- $current := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "periscope.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ if $current }}{{ index $current.data $key | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
{{- end }}
