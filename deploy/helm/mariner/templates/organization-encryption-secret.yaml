{{- if and .Values.organizationEncryption.enabled (not .Values.organizationEncryption.existingSecret.name) }}
{{- $name := include "mariner.organizationEncryptionSecretName" . -}}
{{- $key := include "mariner.organizationEncryptionSecretKey" . -}}
{{- $current := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mariner.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
  immutable: true
type: Opaque
data:
  {{ $key }}: {{ if $current }}{{ required (printf "managed organization encryption Secret %s is missing key %s" $name $key) (index $current.data $key) | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
{{- end }}
