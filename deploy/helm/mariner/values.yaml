replicaCount: 1
image:
  repository: ghcr.io/example/mariner
  # Empty uses the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
# Container requests and limits are configurable per environment. These
# conservative defaults keep the chart schedulable in a local kind cluster.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 256Mi
podSecurityContext:
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
serviceAccount:
  create: true
  automount: true
  annotations: {}
service:
  type: ClusterIP
  port: 8080
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mariner.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sslip-io-tls
      hosts:
        - mariner.127.0.0.1.sslip.io
database:
  # postgres is the default. Set driver: sqlite for lightweight
  # single-replica deployments.
  driver: postgres
  url: ""
  # PostgreSQL TLS mode is chart configuration, not a database Secret field.
  # Examples: disable, require, verify-ca, or verify-full.
  sslMode: disable
  existingSecret:
    name: ""
    # A URL key may be used by setting urlKey and leaving the field selectors
    # empty. Otherwise Mariner assembles a URL from these independently named
    # Secret keys. Host, database, username, and password are required.
    urlKey: ""
    hostKey: host
    portKey: port
    databaseKey: database
    usernameKey: username
    passwordKey: password
persistence:
  # PostgreSQL-backed deployments do not need a shared application PVC.
  # Set true when using SQLite and retaining the vault across restarts.
  enabled: false
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  annotations: {}
organizationEncryption:
  # The chart creates this once and preserves it on upgrades. Uninstalling
  # the release deletes the chart-managed Secret; a fresh install generates
  # a new key. Remove the Secret explicitly to rotate it while installed.
  enabled: true
  secretName: ""
  key: ENCRYPTION_KEY
  # Optional fixed key for GitOps/dev deployments. This makes offline Helm
  # renders deterministic; use existingSecret instead for production secrets.
  value: ""
  # Set existingSecret.name to use a Secret managed outside Helm (for
  # example by ExternalSecrets). When set, the chart does not create a
  # Secret and uses the selected key instead.
  existingSecret:
    name: ""
    key: ENCRYPTION_KEY
oidc:
  issuer: ""
  clientId: ""
  clientSecret: ""
  redirectUrl: ""
  logout:
    # Redirect through the OIDC provider's end-session endpoint after local
    # Mariner session cleanup. Set false for local-only logout.
    enabled: true
  # Name of the JWT claim containing organization group values. The claim can
  # be an array of strings or a single string. Defaults to `groups`.
  groupsClaim: groups
  # OIDC group required for Mariner administrator access, including the admin
  # UI, organization management, and audit history.
  adminGroup: admins
  # Audience validation defaults to the standard `aud` claim and clientId.
  # Set both for providers that use a different audience claim, such as ADFS.
  audienceClaim: aud
  audience: ""
  # JWT claim used for the signed-in display name. Falls back to email and
  # preferred_username when the claim is absent.
  nameClaim: name
  # WARNING: logs the complete ID token and decoded claims. Development only.
  debugJwt: false
  # When set, this existing Secret supplies the OIDC client ID, OIDC client
  # secret, and cookie secret. The selected keys default to
  # OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, and COOKIE_SECRET and are independently
  # configurable.
  existingSecret:
    name: ""
    clientIdKey: OIDC_CLIENT_ID
    clientSecretKey: OIDC_CLIENT_SECRET
    cookieSecretKey: COOKIE_SECRET
caBundle:
  # Optional Secret and/or ConfigMap containing one or more PEM CA files.
  # Filenames and keys are not significant; every regular file is appended to
  # the image's system CA bundle, so public roots remain trusted as well.
  # This global bundle is used for OIDC and S3 TLS.
  secretName: ""
  configMapName: ""
  # Custom CA files are mounted directly into the Mariner container and
  # appended to the platform trust pool by tlsconfig.RootCAs.
cookieSecret: ""
audit:
  enabled: true
  sidecar:
    # The default polls the database for new audit rows and writes their exact
    # event_json to stdout for Alloy/Loki. Replace image/command/args for a
    # direct Splunk HEC shipper.
    enabled: true
    pollingInterval: 2s
    batchSize: 100
    image: ""
    command: []
    args: []
    env: []
    envFrom: []
    extraVolumeMounts: []
# Organizations are selected from the OIDC ID token claim configured by
# `oidc.groupsClaim` (which defaults to `groups`).
# A user is granted an organization when at least one token group matches at
# least one entry in that organization's groups list. Organizations and their
# connections are maps keyed by their stable names. Organization
# connections are predefined by the administrator and are visible to matching
# users alongside their personal vault connections.
#
# Credentials must come from a Kubernetes Secret. Do not put access keys or
# secret keys in this file. The chart creates secretKeyRef environment entries
# and the application resolves the generated environment variable names at
# startup. The referenced Secret may be created by an ExternalSecret supplied
# through extraObjects below.
#
# Example:
# organizations:
#   engineering:
#     name: Engineering
#     groups:
#       - engineering
#       - platform
#     connections:
#       shared-artifacts:
#         bucket: engineering-artifacts
#         region: us-east-1
#         endpoint: https://s3.example.com
#         prefix: shared/
#         credentials:
#           secretName: engineering-artifacts-s3
#           accessKeyKey: accessKey
#           secretKeyKey: secretKey
organizations: {}

# Additional Kubernetes objects rendered after the Mariner resources. This is
# intentionally generic so ExternalSecret, SecretStore, NetworkPolicy, or
# other platform resources can be installed with the same Helm release.
# Objects are rendered as supplied; set metadata.namespace explicitly when
# the object should not use the Helm release namespace.
#
# Example ExternalSecret:
# extraObjects:
#   - apiVersion: external-secrets.io/v1beta1
#     kind: ExternalSecret
#     metadata:
#       name: engineering-artifacts-s3
#     spec:
#       refreshInterval: 1h
#       secretStoreRef:
#         name: production
#         kind: ClusterSecretStore
#       target:
#         name: engineering-artifacts-s3
#       data:
#         - secretKey: accessKey
#           remoteRef:
#             key: s3/engineering/access-key
#         - secretKey: secretKey
#           remoteRef:
#             key: s3/engineering/secret-key
extraObjects: []
extraVolumes: []
extraVolumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
hostAliases: []
