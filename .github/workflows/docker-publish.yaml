name: Build, scan, and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate source and chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Lint chart
        run: helm lint deploy/helm/periscope

      - name: Scan source and chart
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          skip-dirs: deploy/kustomize/local
          trivy-config: .github/trivy.yaml
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Scan frontend packages
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

      - name: Scan Go packages
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ""
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
          repo-checkout: false
          go-package: ./...

  build-quarantine:
    name: Build and scan quarantine image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=quarantine-${{ github.sha }}

      - name: Build and publish quarantine image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan quarantine image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  publish-release:
    name: Sign, promote, and publish chart
    runs-on: ubuntu-latest
    needs: [validate, build-quarantine]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    outputs:
      published-digest: ${{ steps.promote.outputs.digest }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR for ORAS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Promote image digest
        id: promote
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build-quarantine.outputs.digest }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            target_tag="latest"
          elif [[ "$REF" == refs/tags/* ]]; then
            if [[ ! "$REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must be plain semver x.y.z: $REF_NAME" >&2
              exit 1
            fi
            target_tag="$REF_NAME"
          else
            echo "No production promotion for $REF"
            exit 0
          fi
          oras tag "${IMAGE}@${DIGEST}" "${target_tag}"
          echo "Promoted ${IMAGE}:${target_tag} at ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign promoted image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.promote.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: echo "${IMAGE}:${TAG}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"

      - name: Verify promoted image signature
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.promote.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: >-
          cosign verify "${IMAGE}@${DIGEST}"
          --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          --certificate-identity-regexp="^https://github.com/${REPOSITORY}/.github/workflows/.*@refs/tags/${REF_NAME}$"

      - name: Package and publish chart
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          chart_version="${VERSION}"
          helm package deploy/helm/periscope --version "$chart_version" --app-version "$chart_version"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "periscope-${chart_version}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helm-charts"

  prune-registry:
    name: Prune GHCR images and signatures
    runs-on: ubuntu-latest
    needs: publish-release
    # Temporarily disabled while GHCR/Cosign artifact retention is validated.
    if: ${{ false }}
    permissions:
      packages: write
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      PACKAGE_NAME: ${{ github.event.repository.name }}
      CURRENT_TAG: ${{ github.ref_name }}
      CURRENT_DIGEST: ${{ needs.publish-release.outputs.published-digest }}
      KEEP_SEMVER_COUNT: "5"
    steps:
      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Prune stale GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import time

          owner = os.environ["OWNER"]
          package = os.environ["PACKAGE_NAME"]
          image = f"{os.environ['REGISTRY']}/{owner}/{package}"
          current_digest = os.environ.get("CURRENT_DIGEST", "")
          current_tag = os.environ["CURRENT_TAG"]
          keep_semver_count = int(os.environ.get("KEEP_SEMVER_COUNT", "5"))

          def gh(path, method="GET"):
              command = ["gh", "api", "-H", "Accept: application/vnd.github+json", "-H", "X-GitHub-Api-Version: 2022-11-28"]
              if method != "GET":
                  command.extend(["-X", method])
              command.append(path)
              return subprocess.run(command, text=True, capture_output=True)

          def package_base():
              org = gh(f"/orgs/{owner}")
              if org.returncode == 0:
                  return f"/orgs/{owner}/packages/container/{package}/versions"
              return f"/users/{owner}/packages/container/{package}/versions"

          base = package_base()
          versions = []
          page = 1
          while True:
              result = gh(f"{base}?per_page=100&page={page}")
              result.check_returncode()
              batch = json.loads(result.stdout)
              if not batch:
                  break
              versions.extend(batch)
              page += 1

          semver = re.compile(r"^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$")
          # Cosign signatures and related OCI artifacts are tagged with the
          # digest of their subject, for example sha256-<digest>.sig. Keep
          # those artifacts whenever the subject image is retained, even if
          # the registry's referrer index is eventually consistent.
          # GHCR's package API is not authoritative for OCI referrers: it can
          # omit Cosign's legacy tag, or return it after the image version.
          # Treat every digest-style artifact as protected.  In particular,
          # never fall back to deleting an artifact through the package API.
          artifact = re.compile(r"^sha256-([0-9a-f]{64})\..+$")
          artifact_tag = re.compile(r"^sha256-[0-9a-f]{64}\.(?:sig|att|sbom|intoto)$")

          def tags(version):
              return set(version.get("metadata", {}).get("container", {}).get("tags", []) or [])

          release_tags = sorted(
              {tag for version in versions for tag in tags(version) if semver.match(tag)},
              reverse=True,
          )[:keep_semver_count]
          keep_tags = {"latest", "main", current_tag, *release_tags}
          current_hex = current_digest.removeprefix("sha256:")
          keep_ids = set()
          keep_digests = {current_hex} if current_hex else set()

          for version in versions:
              version_tags = tags(version)
              digest = version.get("name", "")
              digest_hex = digest.removeprefix("sha256:")
              # GitHub's package API may omit OCI referrer metadata or report
              # Cosign artifacts as untagged versions. Preserve all signature
              # artifacts and untagged OCI manifests; deleting either can
              # orphan a signature or a child manifest from a retained index.
              is_artifact = any(artifact.match(tag) for tag in version_tags)
              if not version_tags or is_artifact or version_tags & keep_tags or digest_hex in keep_digests:
                  keep_ids.add(version["id"])
                  if digest_hex:
                      keep_digests.add(digest_hex)

          def fetch_manifest(reference):
              result = subprocess.run(
                  ["oras", "manifest", "fetch", reference],
                  text=True,
                  capture_output=True,
              )
              if result.returncode != 0:
                  return None
              try:
                  return json.loads(result.stdout)
              except json.JSONDecodeError:
                  return None

          def fetch_descriptor(reference):
              result = subprocess.run(
                  ["oras", "manifest", "fetch", "--descriptor", reference],
                  text=True,
                  capture_output=True,
              )
              if result.returncode != 0:
                  return None
              try:
                  return json.loads(result.stdout)
              except json.JSONDecodeError:
                  return None

          def legacy_artifact_descriptors(subjects):
              result = subprocess.run(
                  ["oras", "repo", "tags", image],
                  text=True,
                  capture_output=True,
              )
              if result.returncode != 0:
                  raise RuntimeError(f"could not list tags for {image}")
              descriptors = set()
              for tag in result.stdout.splitlines():
                  tag = tag.strip()
                  match = artifact.match(tag)
                  if not match or match.group(1) not in subjects:
                      continue
                  descriptor = fetch_descriptor(f"{image}:{tag}")
                  if descriptor and descriptor.get("digest"):
                      descriptors.add(descriptor["digest"].removeprefix("sha256:"))
              return descriptors

          def direct_artifact_tags():
              """Return all legacy referrer tags visible directly in GHCR."""
              result = subprocess.run(
                  ["oras", "repo", "tags", image],
                  text=True,
                  capture_output=True,
              )
              if result.returncode != 0:
                  raise RuntimeError(f"could not list tags for {image}")
              return {
                  tag.strip()
                  for tag in result.stdout.splitlines()
                  if artifact_tag.match(tag.strip())
              }

          def walk_descriptor_graph(reference, digest, visited):
              digest = digest.removeprefix("sha256:")
              if digest:
                  keep_digests.add(digest)
              visit_key = digest or reference
              if visit_key in visited:
                  return
              visited.add(visit_key)
              document = fetch_manifest(reference)
              if document is None:
                  raise RuntimeError(f"could not fetch kept manifest {reference}")
              config = document.get("config", {})
              if config.get("digest"):
                  keep_digests.add(config["digest"].removeprefix("sha256:"))
              for layer in document.get("layers", []) or []:
                  if layer.get("digest"):
                      keep_digests.add(layer["digest"].removeprefix("sha256:"))
              for child in document.get("manifests", []) or []:
                  child_digest = child.get("digest", "")
                  if child_digest:
                      child_ref = f"{image}@{child_digest}"
                      walk_descriptor_graph(child_ref, child_digest, visited)

          def walk_referrers(reference, visited):
              result = subprocess.run(
                  ["oras", "discover", "--format", "json", "--depth", "1", reference],
                  text=True,
                  capture_output=True,
              )
              if result.returncode != 0:
                  raise RuntimeError(f"could not discover referrers for kept image {reference}")
              try:
                  document = json.loads(result.stdout)
              except json.JSONDecodeError as error:
                  raise RuntimeError(f"invalid referrer response for kept image {reference}") from error
              for referrer in document.get("referrers", []) or []:
                  digest = referrer.get("digest", "")
                  if digest:
                      walk_descriptor_graph(f"{image}@{digest}", digest, visited)

          # GHCR can expose the package tag before all index children are
          # visible. Never prune while the current release graph is incomplete.
          current_reference = f"{image}:{current_tag}"
          current_document = None
          for attempt in range(12):
              current_document = fetch_manifest(current_reference)
              if current_document is not None:
                  break
              if attempt == 11:
                  raise RuntimeError(
                      f"GHCR did not expose the current image tag {current_tag}; refusing to prune"
                  )
              time.sleep(10)

          visited = set()
          walk_descriptor_graph(
              f"{image}@sha256:{current_hex}" if current_hex else current_reference,
              current_hex,
              visited,
          )

          for tag in keep_tags:
              manifest = fetch_manifest(f"{image}:{tag}")
              if manifest is None:
                  if tag == current_tag or tag in {
                      tag_name
                      for version in versions
                      for tag_name in tags(version)
                  }:
                      raise RuntimeError(f"could not fetch kept image tag {tag}; refusing to prune")
                  continue
              walk_descriptor_graph(f"{image}:{tag}", "", visited)
              walk_referrers(f"{image}:{tag}", visited)

          # Cosign versions may be stored using GHCR's legacy tag-based
          # referrer format, which is not always returned by oras discover.
          # Resolve those tags directly and retain their manifest versions.
          for subject in list(keep_digests):
              for suffix in ("sig", "att", "sbom", "intoto"):
                  descriptor = fetch_descriptor(f"{image}:sha256-{subject}.{suffix}")
                  if descriptor and descriptor.get("digest"):
                      keep_digests.add(descriptor["digest"].removeprefix("sha256:"))
          keep_digests.update(legacy_artifact_descriptors(set(keep_digests)))
          protected_artifact_tags = direct_artifact_tags()

          for version in versions:
              digest = version.get("name", "").removeprefix("sha256:")
              if digest in keep_digests:
                  keep_ids.add(version["id"])

          for version in versions:
              subjects = {match.group(1) for tag in tags(version) if (match := artifact.match(tag))}
              if subjects & keep_digests:
                  keep_ids.add(version["id"])

          def delete_ref_with_oras(ref):
              return subprocess.run(
                  ["oras", "manifest", "delete", "--force", ref],
                  text=True,
                  capture_output=True,
              )

          # Delete in passes.  ORAS removes the tag/referrer relationship
          # cleanly; the GitHub API is only a fallback for versions that have
          # no registry reference.  Never API-delete an untagged or
          # digest-artifact version because that is exactly how a signature
          # can be removed while its image tag remains.
          total_deleted = 0
          deleted_ids = set()
          for cleanup_pass in range(1, 6):
              deleted_this_pass = 0
              for version in versions:
                  if version["id"] in keep_ids or version["id"] in deleted_ids:
                      continue
                  version_tags = tags(version)
                  digest = version.get("name", "")
                  if (
                      not version_tags
                      or version_tags.intersection(protected_artifact_tags)
                      or any(artifact_tag.match(tag) for tag in version_tags)
                  ):
                      print(
                          f"Preserving unclassified/artifact version {version['id']} "
                          f"digest={digest} tags={','.join(sorted(version_tags)) or '<untagged>'}"
                      )
                      continue

                  deleted = False
                  for tag in sorted(version_tags):
                      result = delete_ref_with_oras(f"{image}:{tag}")
                      if result.returncode == 0:
                          deleted = True
                          break
                  if not deleted and digest.startswith("sha256:"):
                      result = delete_ref_with_oras(f"{image}@{digest}")
                      deleted = result.returncode == 0
                  if not deleted:
                      result = gh(f"{base}/{version['id']}", method="DELETE")
                      if result.returncode != 0:
                          raise RuntimeError(result.stderr or result.stdout)
                  deleted_ids.add(version["id"])
                  deleted_this_pass += 1
                  total_deleted += 1
              print(f"cleanup pass {cleanup_pass}: deleted {deleted_this_pass}")
              if deleted_this_pass == 0:
                  break
              time.sleep(2)

          # A final direct registry check is intentionally informational.  It
          # makes signature loss visible in the job log without deleting any
          # additional artifact versions.
          remaining_artifacts = direct_artifact_tags()
          print(
              f"Kept {len(keep_ids)} GHCR versions; deleted {total_deleted} stale versions; "
              f"visible legacy artifacts after cleanup: {len(remaining_artifacts)}"
          )
          PY

  verify-published-signature:
    name: Verify published image after pruning
    runs-on: ubuntu-latest
    needs: publish-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify published image signature
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ github.ref_name }}
        run: >-
          cosign verify "${IMAGE}:${TAG}"
          --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          --certificate-identity-regexp="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*@refs/tags/${TAG}$"

  prune-charts:
    name: Prune GHCR Helm chart versions
    runs-on: ubuntu-latest
    needs: publish-release
    # Temporarily disabled while release artifact retention is validated.
    if: ${{ false }}
    permissions:
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
      PACKAGE_NAME: ${{ github.event.repository.name }}
      CURRENT_TAG: ${{ github.ref_name }}
      KEEP_SEMVER_COUNT: "5"
    steps:
      - name: Prune stale chart versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          from urllib.parse import quote

          owner = os.environ["OWNER"]
          package = quote(f"helm-charts/{os.environ['PACKAGE_NAME']}", safe="")
          keep_count = int(os.environ.get("KEEP_SEMVER_COUNT", "5"))
          current_tag = os.environ["CURRENT_TAG"]

          def gh(path, method="GET"):
              command = ["gh", "api", "-H", "Accept: application/vnd.github+json", "-H", "X-GitHub-Api-Version: 2022-11-28"]
              if method != "GET":
                  command.extend(["-X", method])
              command.append(path)
              return subprocess.run(command, text=True, capture_output=True)

          org = gh(f"/orgs/{owner}")
          prefix = f"/orgs/{owner}" if org.returncode == 0 else f"/users/{owner}"
          base = f"{prefix}/packages/container/{package}/versions"
          semver = re.compile(r"^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$")

          def tags(version):
              return set(version.get("metadata", {}).get("container", {}).get("tags", []) or [])

          def load_versions():
              loaded = []
              page = 1
              while True:
                  result = gh(f"{base}?per_page=100&page={page}")
                  result.check_returncode()
                  batch = json.loads(result.stdout)
                  if not batch:
                      break
                  loaded.extend(batch)
                  page += 1
              return loaded

          versions = load_versions()
          for attempt in range(12):
              if any(current_tag in tags(version) for version in versions):
                  break
              if attempt == 11:
                  raise RuntimeError(
                      f"GHCR did not expose the current chart tag {current_tag}; refusing to prune"
                  )
              time.sleep(10)
              versions = load_versions()

          keep_tags = {
              tag
              for tag in sorted(
                  {tag for version in versions for tag in tags(version) if semver.match(tag)},
                  reverse=True,
              )[:keep_count]
          }
          keep_tags.add(current_tag)
          keep_ids = {version["id"] for version in versions if tags(version) & keep_tags}
          deleted = 0
          for version in versions:
              if version["id"] in keep_ids:
                  continue
              result = gh(f"{base}/{version['id']}", method="DELETE")
              if result.returncode != 0:
                  raise RuntimeError(result.stderr or result.stdout)
              deleted += 1
          print(f"Kept chart tags: {', '.join(sorted(keep_tags, reverse=True)) or '<none>'}; deleted {deleted} stale chart versions")
          PY
